spring:
  application:
    name: ms-licitaciones-bs
  profiles:
    active: local
  config:
    import: "optional:file:../../.env[.properties],optional:file:./.env[.properties]"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

licitawatch:
  internal:
    api-key: ${INTERNAL_API_KEY}
  storage:
    dir: ${STORAGE_DIR:C:/licitawatch-storage}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  cierre-automatico:
    cron: "0 5 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
server:
  port: ${MS_LICITACIONES_BS_PORT:8212}
  address: 127.0.0.1
licitawatch:
  servicios:
    licitaciones-bd: ${LICITACIONES_BD_URL:http://localhost:8312}
    usuarios-bs: ${USUARIOS_BS_URL:http://localhost:8211}
    ventas-bs: ${VENTAS_BS_URL:http://localhost:8213}
    notificaciones-bs: ${NOTIFICACIONES_BS_URL:http://localhost:8214}
    chat-bs: ${CHAT_BS_URL:http://localhost:8216}
