server:
  port: ${PORT_GATEWAY:8080}
  # Sin "address" explicita: es el UNICO servicio pensado para ser alcanzable
  # desde fuera de este mismo proceso (el frontend). Todos los demas
  # microservicios escuchan solo en 127.0.0.1 (ver MEMORIA.md).

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: api-usuarios
          uri: http://127.0.0.1:${PORT_USUARIOS:8081}
          predicates:
            - Path=/api/auth/**,/api/perfil/**,/api/admin/usuarios/**
        - id: api-licitaciones
          uri: http://127.0.0.1:${PORT_LICITACIONES:8082}
          predicates:
            - Path=/api/licitaciones/**,/api/postulaciones/**
        - id: api-ms-ventas
          uri: http://127.0.0.1:${PORT_VENTAS:8083}
          predicates:
            - Path=/api/planes/**,/api/ventas/**,/api/suscripciones/**
        - id: api-asistente
          uri: http://127.0.0.1:${PORT_ASISTENTE:8085}
          predicates:
            - Path=/api/asistente/**
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: "http://localhost:5173"
            allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: false

# Rutas /internal/** de cada microservicio NO tienen predicate aqui a
# proposito: el Gateway nunca sabe como llegar a ellas, asi que cualquier
# intento externo de llamarlas via el Gateway recibe 404 (seccion 3.1: "no
# expuesto publicamente por el Gateway").

jwt:
  secret: ${JWT_SECRET}

licitawatch:
  rate-limit:
    login:
      capacidad: 5
      periodo-minutos: 1
    asistente:
      capacidad: 20
      periodo-minutos: 1

logging:
  level:
    cl.licitawatch.gateway: INFO
