spring:
  application:
    name: ms-notificaciones-bff
  profiles:
    active: local
  config:
    import: "optional:file:../../.env[.properties],optional:file:./.env[.properties]"

licitawatch:
  internal:
    api-key: ${INTERNAL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
server:
  port: ${MS_NOTIFICACIONES_BFF_PORT:8114}
  address: 127.0.0.1
licitawatch:
  servicios:
    notificaciones-bs: ${NOTIFICACIONES_BS_URL:http://localhost:8214}
