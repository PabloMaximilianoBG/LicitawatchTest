server:
  port: 8083

spring:
  application:
    name: coincidencias-ms

  datasource:
    url: jdbc:postgresql://localhost:5432/licitawatch_coincidencias
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/licitawatch
