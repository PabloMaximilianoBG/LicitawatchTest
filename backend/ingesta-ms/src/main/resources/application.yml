server:
  port: 8082

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ingesta-ms

  datasource:
    url: jdbc:postgresql://localhost:5432/licitawatch_ingesta
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/licitawatch

mercadopublico:
  ticket: ${MERCADOPUBLICO_TICKET}
