server:
  address: 127.0.0.1
  port: ${PORT_VENTAS:8083}

spring:
  application:
    name: api-ms-ventas
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_VENTAS:ventas_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}

licitawatch:
  notificaciones:
    base-url: http://127.0.0.1:${PORT_NOTIFICACIONES:8084}
  transbank:
    environment: ${TRANSBANK_ENVIRONMENT:integration}
    api-key-id: ${TRANSBANK_API_KEY_ID}
    api-key-secret: ${TRANSBANK_API_KEY_SECRET}
    return-url: ${TRANSBANK_RETURN_URL}

logging:
  level:
    cl.licitawatch.ventas: INFO
