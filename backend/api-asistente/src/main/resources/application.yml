server:
  address: 127.0.0.1
  port: ${PORT_ASISTENTE:8085}

spring:
  application:
    name: api-asistente
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

jwt:
  secret: ${JWT_SECRET}

groq:
  api-key: ${GROQ_API_KEY}
  model: ${GROQ_MODEL}
  base-url: ${GROQ_API_BASE_URL}

licitawatch:
  usuarios:
    base-url: http://127.0.0.1:${PORT_USUARIOS:8081}
  licitaciones:
    base-url: http://127.0.0.1:${PORT_LICITACIONES:8082}
  ventas:
    base-url: http://127.0.0.1:${PORT_VENTAS:8083}
  asistente:
    memoria:
      ttl-minutos: 30
      max-turnos: 10

logging:
  level:
    cl.licitawatch.asistente: INFO
