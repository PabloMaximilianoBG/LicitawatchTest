server:
  port: 8084

spring:
  application:
    name: notificaciones-ms

  datasource:
    url: jdbc:postgresql://localhost:5432/licitawatch_notificaciones
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/licitawatch

# SMTP (Mailtrap) pendiente: agregar spring.mail.host/port/username/password cuando se entreguen las credenciales.
