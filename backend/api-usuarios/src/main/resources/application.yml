server:
  address: 127.0.0.1
  port: ${PORT_USUARIOS:8081}

spring:
  application:
    name: api-usuarios
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_USUARIOS:usuarios_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

licitawatch:
  admin:
    seed:
      email: ${ADMIN_SEED_EMAIL:admin@licitawatch.cl}
      password: ${ADMIN_SEED_PASSWORD:Admin123!}
  rate-limit:
    login:
      capacidad: 5
      periodo-minutos: 1

logging:
  level:
    cl.licitawatch.usuarios: INFO
