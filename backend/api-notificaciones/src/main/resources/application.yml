server:
  address: 127.0.0.1
  port: ${PORT_NOTIFICACIONES:8084}

spring:
  application:
    name: api-notificaciones
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_NOTIFICACIONES:notificaciones_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

licitawatch:
  smtp:
    from: ${SMTP_FROM}
  usuarios:
    base-url: http://127.0.0.1:${PORT_USUARIOS:8081}

logging:
  level:
    cl.licitawatch.notificaciones: INFO
